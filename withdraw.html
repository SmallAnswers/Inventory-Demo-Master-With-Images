<!DOCTYPE html>
<html>
<head>
  <title>Withdraw Items</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: #eef2f3;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
    }

    label {
      font-size: 13px;
      color: #666;
      display: block;
      margin-top: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .item-row {
      border: 1px solid #eee;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .add {
      background: #f1c40f;
    }

    .submit {
      background: #27ae60;
      color: white;
    }

    .back {
      background: #7f8c8d;
      color: white;
    }

    .remove {
      background: #e74c3c;
      color: white;
      padding: 7px;
    }

    .optional {
      font-size: 11px;
      color: #999;
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 460px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 15px;
      padding: 22px;
    }

    .warning {
      color: #c0392b;
    }

    .warning-box {
      padding: 10px;
      background: #fff4f3;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .plan-box {
      padding: 10px;
      background: #fff9e6;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .cancel {
      background: #ddd;
    }

    .anyway {
      background: #e74c3c;
      color: white;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Withdraw Items</h2>

  <label>Name</label>

  <input
    id="name"
    placeholder="Person withdrawing"
  >


  <label>
    Order
    <span class="optional">
      (Optional)
    </span>
  </label>

  <input
    id="orderSearch"
    placeholder="Search Order ID or Order Name..."
    oninput="filterOrders()"
  >

  <select id="orderSelect">

    <option value="">
      No Order / Ad-hoc
    </option>

  </select>


  <div id="itemsContainer"></div>


  <button
    class="add"
    onclick="addRow()">

    + Add Item

  </button>


  <button
    class="submit"
    onclick="submitAll(false)">

    Confirm Withdrawal

  </button>


  <button
    class="back"
    onclick="location.href='index.html'">

    Back

  </button>

</div>


<!-- WARNING -->

<div
  id="warningModal"
  class="modal-bg">

  <div class="modal">

    <h3 class="warning">
      ⚠️ Withdrawal Warning
    </h3>

    <div id="stockWarnings"></div>

    <div id="planWarnings"></div>

    <p>
      You can cancel and adjust the withdrawal,
      or continue anyway.
    </p>

    <div class="modal-buttons">

      <button
        class="cancel"
        onclick="closeWarning()">

        Cancel

      </button>

      <button
        class="anyway"
        onclick="withdrawAnyway()">

        Withdraw Anyway

      </button>

    </div>

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxxaf_a6UciSY1J-Q1iPH9iwZshM1bmoRTEvXvVAsjFQvyCypnj6Knb-5yEadz7dQHO/exec";


let inventory = [];

let orders = [];


// =====================================================
// LOAD PAGE
// =====================================================

async function loadPage() {

  try {

    const [
      inventoryResponse,
      ordersResponse
    ] = await Promise.all([

      fetch(API_URL),

      fetch(
        `${API_URL}?action=getOrders`
      )

    ]);


    const inventoryData =
      await inventoryResponse.json();


    const orderData =
      await ordersResponse.json();


    inventory =
      inventoryData.inventory || [];


    orders =
      orderData.orders || [];


    renderOrders(
      orders
    );


    addRow();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Could not load inventory."
    );

  }

}


// =====================================================
// ORDERS
// =====================================================

function renderOrders(
  list
) {

  const select =
    document.getElementById(
      "orderSelect"
    );


  const current =
    select.value;


  select.innerHTML =
    `<option value="">
      No Order / Ad-hoc
    </option>`;


  list.forEach(
    order => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        order.orderId;


      option.textContent =
        `${order.orderId} — ${order.orderName}`;


      select.appendChild(
        option
      );

    }
  );


  if (
    [...select.options]
      .some(
        option =>
          option.value ===
          current
      )
  ) {
    select.value =
      current;
  }

}


function filterOrders() {

  const search =
    document
      .getElementById(
        "orderSearch"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    orders.filter(
      order => {

        return (
          order.orderName
            .toLowerCase()
            .includes(
              search
            )
          ||
          order.orderId
            .toLowerCase()
            .includes(
              search
            )
        );

      }
    );


  renderOrders(
    filtered
  );

}


// =====================================================
// ITEM ROWS
// =====================================================

function addRow() {

  const container =
    document.getElementById(
      "itemsContainer"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "item-row";


  const options =
    inventory
      .map(
        i =>
          `<option value="${escapeHtml(i.name)}">
            ${escapeHtml(i.name)} (${i.qty})
          </option>`
      )
      .join("");


  div.innerHTML = `

    <select class="item">
      ${options}
    </select>

    <input
      type="number"
      step="any"
      min="0"
      class="qty"
      placeholder="Quantity"
    >

    <button
      class="remove"
      type="button">

      Remove

    </button>

  `;


  div
    .querySelector(
      ".remove"
    )
    .onclick =
      function() {

        div.remove();

      };


  container.appendChild(
    div
  );

}


// =====================================================
// COLLECT ITEMS
// =====================================================

function getItems() {

  const rows =
    document.querySelectorAll(
      ".item-row"
    );


  const items = [];


  rows.forEach(
    row => {

      const item =
        row
          .querySelector(
            ".item"
          )
          .value;


      const qty =
        Number(
          row
            .querySelector(
              ".qty"
            )
            .value
        );


      if (
        item &&
        qty > 0
      ) {

        items.push({
          item: item,
          qty: qty
        });

      }

    }
  );


  return items;

}


// =====================================================
// SUBMIT
// =====================================================

async function submitAll(
  force
) {

  const name =
    document
      .getElementById(
        "name"
      )
      .value
      .trim();


  if (!name) {

    alert(
      "Enter name."
    );

    return;

  }


  const items =
    getItems();


  if (
    items.length === 0
  ) {

    alert(
      "Add at least one item and quantity."
    );

    return;

  }


  const orderId =
    document
      .getElementById(
        "orderSelect"
      )
      .value;


  const url =
    `${API_URL}?action=batchWithdraw` +
    `&name=${encodeURIComponent(name)}` +
    `&orderId=${encodeURIComponent(orderId)}` +
    `&force=${force}` +
    `&items=${encodeURIComponent(JSON.stringify(items))}`;


  try {

    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    if (
      data.requiresConfirmation
    ) {

      showWarning(
        data.shortages || [],
        data.planExcesses || []
      );

      return;

    }


    if (
      !data.success
    ) {

      alert(
        data.error ||
        "Withdrawal failed."
      );

      return;

    }


    alert(
      "All items withdrawn!"
    );


    window.location.href =
      "index.html";


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Withdrawal failed."
    );

  }

}


// =====================================================
// WARNINGS
// =====================================================

function showWarning(
  shortages,
  planExcesses
) {

  const stockContainer =
    document.getElementById(
      "stockWarnings"
    );


  const planContainer =
    document.getElementById(
      "planWarnings"
    );


  stockContainer.innerHTML = "";

  planContainer.innerHTML = "";


  // STOCK WARNING

  if (
    shortages.length > 0
  ) {

    stockContainer.innerHTML =
      `<h4>Stock Shortfall</h4>`;


    shortages.forEach(
      item => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "warning-box";


        div.innerHTML = `

          <strong>
            ${escapeHtml(item.item)}
          </strong>

          <br>

          Available:
          ${item.available}

          <br>

          Requested:
          ${item.requested}

          <br>

          <strong>
            Shortfall:
            ${item.shortfall}
          </strong>

          <br>

          Stock after withdrawal:
          ${item.newQty}

        `;


        stockContainer.appendChild(
          div
        );

      }
    );

  }


  // PLAN WARNING

  if (
    planExcesses.length > 0
  ) {

    planContainer.innerHTML =
      `<h4>Order Plan Exceeded</h4>`;


    planExcesses.forEach(
      item => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "plan-box";


        div.innerHTML = `

          <strong>
            ${escapeHtml(item.item)}
          </strong>

          <br>

          Planned:
          ${item.planned}

          <br>

          Already withdrawn:
          ${item.withdrawnSoFar}

          <br>

          Remaining planned:
          ${item.remainingPlanned}

          <br>

          Requested now:
          ${item.requested}

          <br>

          <strong>
            Exceeds plan by:
            ${item.exceedsBy}
          </strong>

        `;


        planContainer.appendChild(
          div
        );

      }
    );

  }


  document
    .getElementById(
      "warningModal"
    )
    .style.display =
      "flex";

}


function closeWarning() {

  document
    .getElementById(
      "warningModal"
    )
    .style.display =
      "none";

}


async function withdrawAnyway() {

  closeWarning();


  await submitAll(
    true
  );

}


// =====================================================
// HTML SAFETY
// =====================================================

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


window.onload =
  loadPage;

</script>

</body>
</html>
